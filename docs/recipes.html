aft:diamond_sword`)"}, "D": {"en": "Aerie Bronze Ingot (`opusvsexe:aerie_bronze_ingot`)", "uk": "Зливок небесної бронзи (`opusvsexe:aerie_bronze_ingot`)", "ru": "Слиток небесной бронзы (`opusvsexe:aerie_bronze_ingot`)"}}, "icons": {"A": "assets/items/gilded_marble.png", "B": "assets/items/ruby_halo_shard.png", "D": "assets/items/aerie_bronze_ingot.png"}}], "text": {"en": {"title": "Exotron — complete crafting book", "intro": "All 153 JSON recipes shipped in this source snapshot, plus the three Java-defined Resonance Forge conversions. Vanilla Minecraft recipes are outside this book.", "grid": "Each letter means one item in that slot; blank slots stay empty. Identical letters mean identical ingredients. Names and resource IDs are listed below each grid. Compact shaped patterns are shown at the top left of the full station grid. Shapeless layouts are examples: ingredient order and position do not matter.", "groups": ["Crafting table · shaped · 3×3", "Crafting table · shapeless · 3×3", "Opus Assembly Table · 5×5", "Parthenon Forge · 3×3"], "source": "Source", "result": "Result", "legend": "Ingredients", "total": "per craft", "free": "Shapeless recipe — the positions shown are only an example.", "catalyst": "Ruby Halo Shard is returned after crafting; it is not consumed.", "legacy": "Legacy item: this recipe remains in the supplied source, although this weapon was excluded from the current presentation build. Check that your installed JAR matches this source snapshot.", "forge": "Resonance Forge · conversions", "forge_text": "Right-click with flint and steel to switch the forge on. Insert one valid ingredient with right-click; wait 160 ticks (8 seconds at 20 TPS). Collect the output with an empty hand before the next conversion. Each conversion consumes one input and yields one output. Flint and steel switches the forge state; it is not a recipe ingredient.", "exo": "EXO assembly", "exo_text": "After crafting an EXO Assembly Frame and an activation core, right-click the frame with the matching core. Assembly takes 60 ticks (3 seconds at 20 TPS), checks space and occupancy, and spawns that EXO. The core is consumed in Survival. This is a block interaction, not an extra crafting-grid recipe.", "regen": "Regeneration", "regen_text": "Generated from resource JSON and the Resonance Forge implementation. Do not edit generated grids by hand.", "search": "Search recipes or ingredients…", "all": "All stations", "empty": "Empty slot", "any": "any item in tag", "or": "or", "count": "recipes", "print": "Print / save PDF", "view": "Illustrated browser version", "times": "Time", "seconds": "8 seconds at 20 TPS"}, "uk": {"title": "Exotron — усі рецепти крафту", "intro": "Усі 153 JSON-рецепти з цієї копії вихідного коду та три перетворення Resonance Forge, реалізовані в Java. Звичайні рецепти Minecraft до цього каталогу не входять.", "grid": "Літера — один предмет у комірці; порожню комірку треба залишити вільною. Однакові літери означають однакові інгредієнти. Назви та ідентифікатори наведено під схемою. Компактні фігурні рецепти показано в лівому верхньому куті повної сітки станції. Для безформного крафту розкладка умовна: порядок і місце інгредієнтів не важливі.", "groups": ["Верстак · фігурний крафт · 3×3", "Верстак · безформний крафт · 3×3", "Opus Assembly Table · 5×5", "Parthenon Forge · 3×3"], "source": "Джерело", "result": "Результат", "legend": "Інгредієнти", "total": "на один крафт", "free": "Безформний рецепт — розташування на схемі умовне.", "catalyst": "Ruby Halo Shard повертається після крафту й не витрачається.", "legacy": "Застарілий предмет: рецепт залишився у наданих вихідниках, хоча цю зброю прибрано з поточної презентаційної збірки. Перевірте відповідність установленого JAR цій копії коду.", "forge": "Resonance Forge · перетворення", "forge_text": "Увімкніть кузницю кресалом через ПКМ. Покладіть один придатний інгредієнт через ПКМ та зачекайте 160 тактів (8 секунд за 20 TPS). Заберіть результат порожньою рукою перед наступним перетворенням. Кожне перетворення витрачає один вхідний предмет і дає один вихідний. Кресало перемикає стан кузниці та не входить до рецепта.", "exo": "Складання EXO", "exo_text": "Скрафтіть EXO Assembly Frame та ядро активації, потім натисніть ПКМ по рамі відповідним ядром. Складання триває 60 тактів (3 секунди за 20 TPS), перевіряє місце та зайнятість і створює відповідний EXO. У виживанні ядро витрачається. Це взаємодія з блоком, а не додатковий рецепт у сітці.", "regen": "Оновлення каталогу", "regen_text": "Схеми створено з JSON ресурсів і реалізації Resonance Forge. Не редагуйте згенеровані сітки вручну.", "search": "Пошук рецепта або інгредієнта…", "all": "Усі станції", "empty": "Порожня комірка", "any": "будь-який предмет із теґа", "or": "або", "count": "рецептів", "print": "Друк / зберегти PDF", "view": "Ілюстрована версія для браузера", "times": "Час", "seconds": "8 секунд за 20 TPS"}, "ru": {"title": "Exotron — все рецепты крафта", "intro": "Все 153 JSON-рецепта из этой копии исходного кода и три превращения Resonance Forge, реализованные в Java. Обычные рецепты Minecraft в этот каталог не входят.", "grid": "Буква — один предмет в ячейке; пустую ячейку нужно оставить свободной. Одинаковые буквы означают одинаковые ингредиенты. Названия и идентификаторы приведены под схемой. Компактные фигурные рецепты показаны в левом верхнем углу полной сетки станции. Для бесформенного крафта раскладка условная: порядок и положение ингредиентов не важны.", "groups": ["Верстак · фигурный крафт · 3×3", "Верстак · бесформенный крафт · 3×3", "Opus Assembly Table · 5×5", "Parthenon Forge · 3×3"], "source": "Источник", "result": "Результат", "legend": "Ингредиенты", "total": "на один крафт", "free": "Бесформенный рецепт — расположение на схеме условное.", "catalyst": "Ruby Halo Shard возвращается после крафта и не расходуется.", "legacy": "Устаревший предмет: рецепт остался в предоставленных исходниках, хотя это оружие убрано из текущей презентационной сборки. Проверьте соответствие установленного JAR этой копии кода.", "forge": "Resonance Forge · превращения", "forge_text": "Включите кузницу огнивом через ПКМ. Положите один подходящий ингредиент через ПКМ и подождите 160 тактов (8 секунд при 20 TPS). Заберите результат пустой рукой перед следующим превращением. Каждое превращение расходует один входной предмет и даёт один выходной. Огниво переключает состояние кузницы и не входит в рецепт.", "exo": "Сборка EXO", "exo_text": "Скрафтите EXO Assembly Frame и ядро активации, затем нажмите ПКМ по раме подходящим ядром. Сборка занимает 60 тактов (3 секунды при 20 TPS), проверяет место и занятость и создаёт соответствующий EXO. В выживании ядро расходуется. Это взаимодействие с блоком, а не дополнительный рецепт в сетке.", "regen": "Обновление каталога", "regen_text": "Схемы созданы из JSON ресурсов и реализации Resonance Forge. Не редактируйте сгенерированные сетки вручную.", "search": "Поиск рецепта или ингредиента…", "all": "Все станции", "empty": "Пустая ячейка", "any": "любой предмет из тега", "or": "или", "count": "рецептов", "print": "Печать / сохранить PDF", "view": "Иллюстрированная версия для браузера", "times": "Время", "seconds": "8 секунд при 20 TPS"}}, "conversions": {"en": [["Raw Opus", "Stabilized Opus"], ["Stabilized Opus", "Resonant Opus"], ["Resonant Opus", "Core Opus"]], "uk": [["Сирий Опус", "Стабілізований Опус"], ["Стабілізований Опус", "Резонансний Опус"], ["Резонансний Опус", "Ядро Опуса"]], "ru": [["Необработанный Опус", "Стабилизированный Опус"], ["Стабилизированный Опус", "Резонансный Опус"], ["Резонансный Опус", "Ядро Опуса"]]}}</script>
<script>
const data=JSON.parse(document.querySelector('#data').textContent),byId=id=>document.getElementById(id);let language='uk';
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const format=s=>escape(s).replace(/`([^`]+)`/g,'<code>$1</code>');
function render(){const t=data.text[language],query=byId('search').value.toLocaleLowerCase(),station=byId('station').value;document.documentElement.lang=language;
byId('title').textContent=t.title;byId('intro').textContent=t.intro;byId('help').textContent=t.grid;byId('search').placeholder=t.search;byId('print').textContent=t.print;
const selected=data.recipes.filter(r=>(station===''||Number(station)===r.group)&&JSON.stringify(r).toLocaleLowerCase().includes(query));
byId('cards').innerHTML=selected.map(r=>`<article class="card" id="recipe-${r.id}"><div class="station">${escape(t.groups[r.group])}</div><h2>${escape(r.names[language])}</h2><div class="result">${escape(t.result)}: <strong>${escape(r.names[language])} ×${r.count}</strong><br><code>${escape(r.result)}</code></div>${r.id==='laser_gun'?`<p class="note">${escape(t.legacy)}</p>`:''}${r.group===1?`<p class="note">${escape(t.free)}</p>`:''}<div class="grid" style="--n:${r.grid.length}" role="img" aria-label="${escape(r.names[language])}">${r.grid.flat().map(s=>`<div class="slot" title="${escape(s===' '?t.empty:r.ingredients[s][language].replaceAll('`',''))}">${s===' '?'':r.icons[s]?`<img src="${escape(r.icons[s])}" alt="${escape(s)}"><span class="symbol">${s}</span>`:s}</div>`).join('')}</div><strong>${escape(t.legend)} (${escape(t.total)})</strong><ul>${Object.entries(r.ingredients).map(([s,names])=>`<li><b>${s}</b> — ${format(names[language])} ×${r.counts[s]}</li>`).join('')}</ul>${r.group===3&&JSON.stringify(r.ingredients).includes('opusvsexe:ruby_halo_shard')?`<p class="note">${escape(t.catalyst)}</p>`:''}<a class="source" href="../${r.source}">${escape(t.source)}: ${escape(r.id)}.json</a></article>`).join('');

byId('extra').innerHTML=`<h2>${escape(t.forge)}</h2><p>${escape(t.forge_text)}</p><table><thead><tr><th>1 × input</th><th>1 × output</th><th>${escape(t.times)}</th></tr></thead><tbody>${data.conversions[language].map(([a,b])=>`<tr><td>${escape(a)}</td><td>${escape(b)}</td><td>${escape(t.seconds)}</td></tr>`).join('')}</tbody></table><h2>${escape(t.exo)}</h2><p>${escape(t.exo_text)}</p><h2>${escape(t.regen)}</h2><p>${escape(t.regen_text)}</p><code>python3 scripts/generate_recipe_book.py</code>`;
}
function stations(){const t=data.text[language],v=byId('station').value;byId('station').innerHTML=`<option value="">${escape(t.all)}</option>`+t.groups.map((s,i)=>`<option value="${i}">${escape(s)}</option>`).join('');byId('station').value=v;}
